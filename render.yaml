# Render Blueprint — the deployed service, as code.
#
# Create the service by pointing Render at this repo ("New > Blueprint"); the
# two `sync: false` values are prompted for once at creation and then live in
# the dashboard, never in git. AUTH_SECRET is generated by Render on creation
# and left alone after that — rotating it signs out every admin, owner and
# staff session at once, since it's the key `lib/auth.ts` signs cookies with.
services:
  - name: tap-tap-grow
    type: web
    runtime: node
    plan: starter # $7/mo, always-on. The free tier sleeps after 15 min idle,
      # which would make the first tap of the day wait on a cold start.
    region: oregon # Change to whichever region is closest to the businesses.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: / # Static route, so the check costs no database query.
    # The apex cannot take a CNAME, so point an A record at the IP Render
    # shows for this service (or use a provider with ALIAS/ANAME flattening —
    # Cloudflare and Namecheap both do). Add www.meetcompass.io here too if
    # you want it; Render will serve it, but it needs its own DNS record, so
    # it is left out until that record exists rather than sitting unverified.
    domains:
      - meetcompass.io
    envVars:
      # Baked into the bundle at build time by `next build`, not read at
      # runtime — so changing it requires a rebuild, which a Render env var
      # change triggers. See the cutover notes in README.md.
      #
      # This hostname is also written onto physical NFC tags, which makes it
      # the least reversible value in this file. A tag carries the whole URL,
      # so every hostname ever handed out has to keep resolving for as long as
      # the tags are in the field — you cannot fix a tag you no longer hold.
      # That is the argument for the apex over a subdomain named after the
      # product: meetcompass.io survives a rename of the product, ttg. does
      # not, and retiring it later would mean collecting tags back in person.
      - key: NEXT_PUBLIC_APP_URL
        value: https://meetcompass.io
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # TWILIO_* and RESEND_* are deliberately absent. `lib/sms.ts` and
      # `lib/email.ts` log to the console when their keys are missing, which
      # is what we want until signup texts and owner logins are in scope.
